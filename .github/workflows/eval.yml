name: ci-and-evals

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install (offline mode — no provider keys needed)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src evals tests
      - name: Unit tests
        run: pytest -q
      - name: Evaluation gate (fails build if metrics regress)
        run: python -m evals.run_evals
      - name: Supply-chain audit (non-blocking)
        run: |
          pip install pip-audit
          pip-audit || true
